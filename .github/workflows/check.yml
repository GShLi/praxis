name: Check
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.15.0, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: pnpm install --frozen-lockfile
      - run: pnpm native:build
      - run: pnpm check
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: praxis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm native:build
      - run: pnpm test:postgres
        env:
          PRAXIS_TEST_DATABASE_URL: postgresql://postgres:praxis_test@127.0.0.1:5432/postgres
